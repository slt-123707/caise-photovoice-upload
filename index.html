<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E8F6E">
<meta name="robots" content="noindex">
<title>CAISE — My AI Diary</title>
<!--
  The diary is closed between study iterations.
  To reopen: git checkout iteration-1 -- index.html  (then commit + push),
  and re-enable the caise-upload Logic App in Azure.
-->
<script>
(function () {
  try {
    var t = localStorage.getItem('caise-theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gradient: linear-gradient(135deg, #18A57C 0%, #0E8F6E 55%, #0B7257 100%);
  --page-bg: linear-gradient(180deg, #F1FAF6 0%, #E3F4EC 100%);
  --surface: #FFFFFF;
  --text: #14211C;
  --text-light: #5C6B66;
  --shadow-lg: 0 10px 34px rgba(14, 143, 110, 0.18);
}

:root[data-theme="dark"] {
  --gradient: linear-gradient(135deg, #16A883 0%, #0E8F6E 55%, #0A6B52 100%);
  --page-bg: linear-gradient(180deg, #0F1714 0%, #0B120F 100%);
  --surface: #18211D;
  --text: #E8EFEC;
  --text-light: #9DB0A9;
  --shadow-lg: 0 10px 34px rgba(0, 0, 0, 0.50);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--page-bg);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

main {
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  text-align: center;
}

header {
  background: var(--gradient);
  color: #FFFFFF;
  padding: 28px 24px;
}

header h1 { font-size: 1.5rem; font-weight: 700; }

.body { padding: 28px 24px 32px; }
.body p { font-size: 1.05rem; line-height: 1.6; }
.body p + p { margin-top: 14px; color: var(--text-light); font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>My AI Diary</h1>
  </header>
  <div class="body">
    <p>The diary is closed for now.<br>Thank you for sharing your moments with us!</p>
    <p>If you have any questions, please ask your teacher.</p>
  </div>
</main>
</body>
</html>
